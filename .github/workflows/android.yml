name: Build Ice Cool APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Android SDK & local.properties
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: Accept SDK Licenses
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Download & Setup Modern Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
        unzip -q gradle.zip
        sudo mv gradle-8.5 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ice-cool-browser-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
